<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="header">
    <span class="logo-badge">
      <img src="images/icon-96.png" class="logo" alt="">
      <svg class="logo-spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0l2.4 8.4L22 11l-7.6 2.6L12 22l-2.4-8.4L2 11l7.6-2.6z"/>
      </svg>
    </span>
    <h1 class="title display">Swiftly</h1>
    <span id="save-status" class="save-status"></span>
    <button id="nav-btn" class="header-action hidden">Info</button>
  </header>

  <main>

    <!-- Loading -->
    <div id="view-loading">
      <div class="card">
        <div class="loading-row">
          <div class="loading-dot"></div>
          <span class="state-label">Loading…</span>
        </div>
      </div>
    </div>

    <!-- Info / profile manager -->
    <div id="view-info" class="hidden">
      <div id="info-content"></div>
    </div>

    <!-- Profile ready + page status -->
    <div id="view-main" class="hidden">

      <div class="hero-card card">
        <svg class="hero-burst" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0l2.4 8.4L22 11l-7.6 2.6L12 22l-2.4-8.4L2 11l7.6-2.6z"/>
        </svg>
        <div class="section-label">Current page</div>

        <div id="page-checking" class="page-state">
          <span class="hint">Checking this page…</span>
        </div>

        <div id="page-supported" class="page-state hidden">
          <div class="status-row status-page-ready">
            <span class="dot"></span>
            <span id="provider-status-text">Supported application detected</span>
          </div>
          <button id="autofill-btn" class="btn-hero">Autofill with Swiftly</button>
          <p class="hero-microcopy">Fills what it's confident about. You review the rest.</p>
          <p id="autofill-report" class="hero-microcopy hidden"></p>
        </div>

        <div id="page-other" class="page-state hidden">
          <div class="status-row status-inactive">
            <span class="dot"></span>
            <span>No supported application detected</span>
          </div>
          <p class="hint">Head to a Greenhouse, Ashby, Gem or Workday job application to use autofill.</p>
        </div>
      </div>

      <div class="card">
        <div class="status-row status-active">
          <span class="dot"></span>
          <span>Profile saved</span>
        </div>
        <p id="profile-name" class="profile-name"></p>
        <div id="resume-status" class="resume-status hidden">
          <span class="resume-icon">📄</span>
          <span id="resume-status-name" class="resume-status-text"></span>
        </div>
      </div>

    </div>

  </main>

</body>
<script src="autofill/matching.js"></script>
<script src="popup.js" type="module"></script>
</html>
