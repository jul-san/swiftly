<!DOCTYPE html>
<!-- Workday "Sign In" page shown before an application. Swiftly must not fill it. -->
<html><head><meta charset="utf-8"><title>Workday sign in fixture</title></head>
<body>
<div data-automation-id="signInContent">
  <h2>Sign In</h2>
  <label for="email-in">Email Address</label><input id="email-in" data-automation-id="email" type="text">
  <label for="pw">Password</label><input id="pw" data-automation-id="password" type="password">
  <button data-automation-id="signInSubmitButton">Sign In</button>
</div>
</body></html>
