<!DOCTYPE html>
<!--
  Gem-hosted application fixture (jobs.gem.com/<company>/<posting>).
  Gem's form is client-rendered with generated ids and no platform-specific
  attributes, so this fixture only uses generic accessible patterns:
  <label for> text inputs with generated ids, an ARIA combobox whose listbox
  is portaled to the end of <body>, Yes/No toggle buttons, a radio fieldset,
  a "select all that apply" checkbox group, a file input, and a textarea.
  No employer content.
-->
<html><head><meta charset="utf-8"><title>Gem fixture</title>
<style>.hidden{display:none}</style></head>
<body>
<main>
  <h1>Apply</h1>
  <form id="gem-form">
    <div class="field"><label for="f-a1">First name *</label><input id="f-a1" type="text" required></div>
    <div class="field"><label for="f-a2">Last name *</label><input id="f-a2" type="text" required></div>
    <div class="field"><label for="f-a3">Email address *</label><input id="f-a3" type="email" required></div>
    <div class="field"><label for="f-a4">Phone number</label><input id="f-a4" type="tel"></div>
    <div class="field"><label for="f-a5">Resume *</label><input id="f-a5" type="file" required></div>
    <div class="field"><label for="f-a6">LinkedIn URL</label><input id="f-a6" type="url"></div>
    <div class="field"><label for="f-a7">Personal website</label><input id="f-a7" type="url"></div>
    <div class="field"><label for="f-a8">Current location</label><input id="f-a8" type="text"></div>

    <div class="field">
      <label id="f-b1-label" for="f-b1">Highest degree obtained *</label>
      <input id="f-b1" role="combobox" aria-expanded="false" aria-controls="f-b1-list" aria-labelledby="f-b1-label" aria-required="true" readonly placeholder="Select an option">
    </div>

    <div class="field yesno">
      <label>Will you now or in the future require visa sponsorship to work in the US? *</label>
      <div class="toggle"><button type="button" aria-pressed="false">Yes</button><button type="button" aria-pressed="false">No</button></div>
    </div>
    <div class="field yesno">
      <label>Are you authorized to work in the US? *</label>
      <div class="toggle"><button type="button" aria-pressed="false">Yes</button><button type="button" aria-pressed="false">No</button></div>
    </div>

    <fieldset class="field">
      <legend>Which work arrangement do you prefer?</legend>
      <label><input type="radio" name="arr" value="remote"> Remote</label>
      <label><input type="radio" name="arr" value="hybrid"> Hybrid</label>
      <label><input type="radio" name="arr" value="onsite"> Onsite</label>
    </fieldset>

    <fieldset class="field">
      <legend>How did you hear about us? (select all that apply)</legend>
      <label><input type="checkbox" name="src" value="1"> LinkedIn</label>
      <label><input type="checkbox" name="src" value="2"> Referral</label>
      <label><input type="checkbox" name="src" value="3"> Other</label>
    </fieldset>

    <div class="field"><label for="f-c1">Anything else you'd like us to know?</label><textarea id="f-c1"></textarea></div>
    <div class="field"><label for="f-c2">Years of professional experience</label><input id="f-c2" type="number"></div>
    <div class="field"><label><input type="checkbox" id="f-c3"> I agree to the processing of my data per the privacy policy</label></div>
    <button type="submit">Submit application</button>
  </form>
</main>
<script>
  window.__submits = 0;
  document.getElementById("gem-form").addEventListener("submit", e => { e.preventDefault(); window.__submits++; });
  for (const t of document.querySelectorAll(".toggle")) t.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    for (const x of t.querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
  });
  // ARIA combobox with a listbox portaled to <body>, opened by click.
  const combo = document.getElementById("f-b1");
  const DEGREES = ["High school", "Associate's", "Bachelor's", "Master's", "PhD", "Other"];
  function close() { document.getElementById("f-b1-list")?.remove(); combo.setAttribute("aria-expanded", "false"); }
  combo.addEventListener("click", () => {
    if (document.getElementById("f-b1-list")) return close();
    const ul = document.createElement("ul"); ul.id = "f-b1-list"; ul.setAttribute("role", "listbox");
    for (const d of DEGREES) {
      const li = document.createElement("li"); li.setAttribute("role", "option"); li.textContent = d;
      li.addEventListener("click", () => { combo.value = d; close(); });
      ul.append(li);
    }
    document.body.append(ul); combo.setAttribute("aria-expanded", "true");
  });
  combo.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
</script>
</body></html>
