<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>

  <!-- Loading -->
  <div id="view-loading" class="desktop-page">
    <div class="card">
      <div class="loading-row">
        <div class="loading-dot"></div>
        <span class="state-label">Loading…</span>
      </div>
    </div>
  </div>

  <!-- Home -->
  <div id="view-home" class="hidden">
    <div class="desktop-page home-page">

      <div class="home-brand">
        <span class="logo-badge home-logo-badge">
          <img src="icon-256.png" class="logo" alt="">
          <svg class="logo-spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0l2.4 8.4L22 11l-7.6 2.6L12 22l-2.4-8.4L2 11l7.6-2.6z"/>
          </svg>
        </span>
        <h1 class="home-title display">Swiftly</h1>
      </div>

      <div class="hero-card card home-profile-card">
        <svg class="hero-burst" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0l2.4 8.4L22 11l-7.6 2.6L12 22l-2.4-8.4L2 11l7.6-2.6z"/>
        </svg>
        <div class="section-label">Your Swiftly profile</div>
        <p id="home-name" class="home-name"></p>
        <p id="home-summary" class="home-summary"></p>
        <button id="edit-profile-btn" class="btn-hero">Edit Profile</button>
        <p class="hero-microcopy">Shared with the Swiftly Safari extension.</p>
      </div>

    </div>
  </div>

  <!-- Profile editor -->
  <div id="view-editor" class="hidden">
    <header class="header">
      <button id="back-btn" class="header-action">← Home</button>
      <span class="logo-badge">
        <img src="icon-96.png" class="logo" alt="">
        <svg class="logo-spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0l2.4 8.4L22 11l-7.6 2.6L12 22l-2.4-8.4L2 11l7.6-2.6z"/>
        </svg>
      </span>
      <h1 class="title display">Edit Profile</h1>
      <span id="save-status" class="save-status"></span>
    </header>
    <main class="desktop-page editor-page">
      <div id="info-content"></div>
    </main>
  </div>

</body>
<script src="desktop.js" type="module"></script>
</html>
